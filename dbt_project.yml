name: 'jaffle_shop'

config-version: 2
version: '0.1'

profile: 'jaffle_shop'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_modules"
    - "logs"

require-dbt-version: [">=1.11.0", "<2.0.0"]

# Echo the Snowflake QUERY_TAG (and dbt invocation id) at the start of every run
# so it can be copied into Snowsight > Query History to find all SQL from the run.
on-run-start:
  - "{{ log('=== Snowflake QUERY_TAG for this run: ' ~ env_var('DBT_QUERY_TAG', invocation_id) ~ ' ===', info=true) }}"

seeds: 
  +docs:
    node_color: '#cd7f32'

models:
  jaffle_shop:
    +materialized: table
    staging:
      +materialized: view
      +docs:
        node_color: 'silver'
    +docs:
      node_color: 'gold'
